{{- $url := printf "/ivl/taxa/%s" (.Get 0 | lower) -}}
{{- $page := site.GetPage $url -}}
<span>
{{- if $page -}}<a href="{{ $page.Permalink }}">{{ $page.Title }}</a>{{- else -}}
<span class="broken-link">{{ (.Get 0) }}</span>
{{- end -}}
{{- if (.Get 1) -}}&nbsp;<span class="taxon-describer-authority">{{(.Get 1)}}</span>{{ end }}</span>
